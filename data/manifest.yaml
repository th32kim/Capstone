# One entry per corpus clip. Tracked in git; the .mp4s themselves are not.
# `labelled` and `label_mode` gate what eval/ is allowed to compute — see docs/CORPUS.md.
clips:
  - id: clip01
    path: data/corpus/clip01.mp4
    source_kind: gopro          # gopro | glasses | iphone | webcam
    duration_s: null            # filled by `hindsight probe`
    scenes: [conversation, walking, reading_screen]
    consent: "verbal, all participants, 2026-07-xx"
    labelled: false
    label_mode: null            # dense | assisted   (recall REQUIRES dense — see docs/CORPUS.md)
    labellers: []
    held_out: false             # at least one clip must be held_out AND dense

  # Decode params (target_fps: 4, max_long_edge_px: 1280) now come from configs/default.yaml as a
  # global 4K-safe default, so per-clip overrides below are only needed for exceptions. resolve_source
  # honours a per-clip `target_fps` / `max_long_edge_px` here if a clip needs to differ.
  - id: plane_1                 # 4K aircraft-cabin POV (window view, reading a menu). gitignored .mp4
    path: sample-videos/plane_1.MP4
    source_kind: gopro          # 3840x2160, 59.94 fps, 48 kHz -> 16 kHz (measured: ffprobe 2026-07-19)
    duration_s: null            # filled by `hindsight probe` (measured 80.11 s). At 4 fps / 1280 cap
                                # the runner materialises ~888 MB of RGB (321 frames) — no OOM at 80 s,
                                # but scales linearly, so a 30-min clip needs streaming (HANDOFF #7).
    scenes: [reading_document, cabin_interior, window_view]
    consent: "developer's own footage"
    labelled: false
    label_mode: null
    labellers: []
    held_out: false

  - id: plane_2                 # 4K aircraft-cabin POV, second capture. gitignored .mp4
    path: sample-videos/plane_2.MP4
    source_kind: gopro          # 3840x2160, 59.94 fps, 48 kHz (measured: ffprobe 2026-07-19, 40.06 s)
    duration_s: null            # filled by `hindsight probe`
    scenes: [cabin_interior, window_view]
    consent: "developer's own footage"
    labelled: false
    label_mode: null
    labellers: []
    held_out: false

  # --- clips referenced by DESIGN_DELTAS but NOT on this checkout ------------------------------
  # Registry entries only: provide the file locally at `path`, then `hindsight probe` fills
  # duration_s. No metadata is asserted for a file that is absent (CLAUDE.md §1.1).
  - id: plane_1_720p            # 720p downscale of plane_1: `make prep-720p SRC=sample-videos/plane_1.MP4 DST=<path>`
    path: data/corpus/plane_1_720p.mp4
    source_kind: gopro          # expected 1280x720, 59.94 fps, 48 kHz (derived from plane_1)
    duration_s: null
    scenes: [reading_document, cabin_interior, window_view]
    consent: "developer's own footage"
    labelled: false
    label_mode: null
    labellers: []
    held_out: false

  - id: walk_1                  # 1080p WALKING POV (indoor, continuous ego-motion). D-2 validation clip.
    path: sample-videos/IMG_6983.MOV
    source_kind: iphone         # heavy walking motion + blur -> the case ego-compensation (D2) exists for.
    duration_s: null            # NOT committed; the D-2 walking-footage numbers were a local hand-run.
    scenes: [walking, indoor]
    consent: "developer's own footage"
    labelled: false
    label_mode: null
    labellers: []
    held_out: false

  - id: face1                   # face-detection test footage (sample-videos/), gitignored .mov
    path: sample-videos/face_1.mov
    source_kind: iphone         # 480x854 portrait, 30 fps, 44.1 kHz (measured: ffprobe 2026-07-19)
    duration_s: null            # filled by `hindsight probe`
    scenes: [face]
    consent: "sample footage"
    labelled: false
    label_mode: null
    labellers: []
    held_out: false
